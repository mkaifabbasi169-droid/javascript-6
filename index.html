<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess to WIN</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        h1 {
            margin-bottom: 50px;
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
            max-width: 1500px;
            margin: auto;
        }

        .card {
            width: 180px;
            height: 270px;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .number {
            width: 180px;
            height: 270px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            border: 2px solid black;
            border-radius: 10px;
        }

        button {
            margin-top: 50px;
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Guess to WIN</h1>

    <div class="container">

        <div class="card" id="card1">
            <img src="./images.jpg" alt="Card">
        </div>

        <div class="card" id="card2">
            <img src="./images.jpg" alt="Card">
        </div>

        <div class="card" id="card3">
            <img src="./images.jpg" alt="Card">
        </div>

        <div class="card" id="card4">
            <img src="./images.jpg" alt="Card">
        </div>

        <div class="card" id="card5">
            <img src="./images.jpg" alt="Card">
        </div>

        <div class="card" id="card6">
            <img src="./images.jpg" alt="Card">
        </div>

    </div>

    <button onclick="resetGame()">Reset</button>

    <script src="index.js"></script>

</body>
</html>
